name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Testes unitarios
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Preparar o Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Checar tipos
        run: npx tsc -b

      - name: Rodar os testes com cobertura
        run: npm run test:coverage

      - name: Resumo no painel do workflow
        if: always()
        run: |
          {
            echo "## Cobertura"
            echo
            if [ -f coverage/coverage-summary.json ]; then
              node -e "
                const t = require('./coverage/coverage-summary.json').total;
                const row = (nome, m) => \`| \${nome} | \${m.covered}/\${m.total} | \${m.pct}% |\`;
                console.log('| Metrica | Coberto | Percentual |');
                console.log('| --- | --- | --- |');
                console.log(row('Linhas', t.lines));
                console.log(row('Instrucoes', t.statements));
                console.log(row('Ramos', t.branches));
                console.log(row('Funcoes', t.functions));
              "
            else
              echo "Relatorio de cobertura nao gerado."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar o relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage
          retention-days: 14

  qualidade:
    name: Lint e build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Preparar o Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build de producao
        run: npm run build

      - name: Guardar o build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
