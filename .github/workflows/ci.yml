name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Checar tipos
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Testes unitarios
        run: npm run test

      - name: Build de producao
        run: npm run build

      - name: Guardar o build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
