name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Uma publicacao por vez. Se chegar um push novo no meio, a anterior termina
# antes, para o site nunca ficar com arquivos de duas versoes.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    name: Build e publicacao
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Preparar o Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producao
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Preparar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar os arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
